# Included in every location: add_header in a location replaces the server-level ones.
# No framing (the public sign page must not be clickjacked), no MIME sniffing, and no Referer,
# since share links carry their access token in the URL.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
