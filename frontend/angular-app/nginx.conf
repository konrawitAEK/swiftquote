server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed build output (chunk-*.js, main-*.js, styles-*.css) can be cached forever.
    # Hashes are base64url, so they may contain "-" and "_".
    location ~* "^/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A missing script or stylesheet is a 404, not index.html (a stale tab after a deploy fails clearly).
    location ~* \.(js|css|map)$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback so deep links like /p/<token> load the app.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
