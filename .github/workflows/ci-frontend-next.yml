name: Frontend Next.js
on:
  push:
    paths: ["frontend/nextjs-app/**", "contracts/**", ".github/workflows/ci-frontend-next.yml"]
  pull_request:
    paths: ["frontend/nextjs-app/**", "contracts/**", ".github/workflows/ci-frontend-next.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nextjs-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/nextjs-app/package-lock.json
      - run: npm ci
      - name: Generated API types match the contract
        working-directory: .
        run: |
          make gen-types
          git diff --exit-code -- frontend/nextjs-app/src/api/schema.d.ts \
            || { echo "::error::schema.d.ts is stale. Run 'make gen-types' and commit."; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
