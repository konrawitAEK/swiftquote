name: Contract Lint
on:
  push:
    paths: ["contracts/**"]
  pull_request:
    paths: ["contracts/**"]
jobs:
  spectral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx --yes @stoplight/spectral-cli lint contracts/openapi.yaml --ruleset contracts/spectral.yml
