name: Frontend Angular
on:
  push:
    paths: ["frontend/angular-app/**", "contracts/**", ".github/workflows/ci-frontend-angular.yml"]
  pull_request:
    paths: ["frontend/angular-app/**", "contracts/**", ".github/workflows/ci-frontend-angular.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/angular-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular 22 needs Node >= 22.22.3; "22" resolves to the latest 22.x.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/angular-app/package-lock.json
      - run: npm ci
      - name: Generated API types match the contract
        working-directory: .
        run: |
          make gen-types
          git diff --exit-code -- frontend/angular-app/src/app/api/schema.d.ts \
            || { echo "::error::schema.d.ts is stale. Run 'make gen-types' and commit."; exit 1; }
      - run: npm run lint
      # Vitest (jsdom, headless) via the Angular CLI unit-test builder; includes the shared pricing fixtures.
      - run: npm test
      - run: npm run build
