name: Frontend Angular
on:
  # PRs run on pull_request; push only for main, so a PR branch isn't built twice.
  # Makefile pins the openapi-typescript version the drift check uses.
  push:
    branches: [main]
    paths: ["frontend/angular-app/**", "contracts/**", "Makefile", ".github/workflows/ci-frontend-angular.yml"]
  pull_request:
    paths: ["frontend/angular-app/**", "contracts/**", "Makefile", ".github/workflows/ci-frontend-angular.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/angular-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular 22 needs Node >= 22.22.3; pin a minor that satisfies it (a bare "22" may use a stale cached 22.x).
          node-version: '22.23'
          cache: npm
          cache-dependency-path: frontend/angular-app/package-lock.json
      - run: npm ci
      - name: Generated API types match the contract
        working-directory: .
        run: |
          make gen-types
          git diff --exit-code -- frontend/angular-app/src/app/api/schema.d.ts \
            || { echo "::error::schema.d.ts is stale. Run 'make gen-types' and commit."; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      # Vitest (jsdom, headless) via the Angular CLI unit-test builder; includes the shared pricing fixtures.
      - run: npm test
      - run: npm run build
      - name: Docker image builds
        run: docker build --build-arg API_URL=http://localhost:8080/api/v1 -t swiftquote-angular-ci .
