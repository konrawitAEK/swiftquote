spring.application.name=swiftquote-spring-boot-service
server.port=${PORT:8080}

# Same env vars as the Go service (see docker-compose.yml).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swiftquote}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
swiftquote.jwt-secret=${JWT_SECRET:}
swiftquote.cors-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

# Schema is owned by db/migrations; never let Spring create or alter it.
spring.sql.init.mode=never
