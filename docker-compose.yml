services:
  # Shared Database
  postgres:
    image: postgres:16-alpine
    container_name: swiftquote-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swiftquote
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied only when the pgdata volume is first created; `make reset-db` to re-run.
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiftquote"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal-net

  # ----------------- BACKENDS (Only ONE active on 8080) -----------------
  backend-go:
    build:
      context: ./backend/go-service
      dockerfile: Dockerfile
    container_name: swiftquote-backend-go
    profiles: ["go", "all"]
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: swiftquote
      JWT_SECRET: swiftquote-dev-only-jwt-secret-change-me
      STORAGE: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-net

  backend-spring:
    build:
      context: ./backend/spring-boot-service
      dockerfile: Dockerfile
    container_name: swiftquote-backend-spring
    profiles: ["spring"]
    ports:
      # SPRING_PORT=8081 lets Spring run beside Go for `make parity`.
      - "${SPRING_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swiftquote
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: swiftquote-dev-only-jwt-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-net

  # ----------------- FRONTENDS -----------------
  frontend-react:
    build:
      context: ./frontend/react-mui-app
      dockerfile: Dockerfile
      args:
        # Build-time: Vite inlines it, and the browser (on the host) calls the API.
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: swiftquote-fe-react
    profiles: ["react", "all"]
    ports:
      - "3000:3000"
    networks:
      - internal-net

  frontend-next:
    build:
      context: ./frontend/nextjs-app
      dockerfile: Dockerfile
    container_name: swiftquote-fe-next
    profiles: ["next"]
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    networks:
      - internal-net

  frontend-angular:
    build:
      context: ./frontend/angular-app
      dockerfile: Dockerfile
    container_name: swiftquote-fe-angular
    profiles: ["angular"]
    ports:
      - "3002:80"
    environment:
      API_URL: http://localhost:8080/api/v1
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  pgdata:
