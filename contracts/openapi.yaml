openapi: 3.0.3
info:
  title: SwiftQuote Interchangeable API
  version: 3.0.0
  description: >-
    Canonical API specification for the SwiftQuote multi-tenant engine.


    Roles (one per user, read from the database on every request so changes apply immediately):

    - admin (shown as "Back Office"): manages users, team structure, product categories and products (price, cost,
      stock); no access to quotes or the dashboard.

    - rm: creates and edits their own quotes, submits them for approval, and sends approved quotes.

    - wo: leads one or more teams; sees and approves or returns quotes created by the RMs in those teams.

    - woc: sees every quote in the tenant and the sales dashboard.

    - customer: belongs to one client; sees that client's sent quotes and accepts or rejects them.


    Quote workflow: draft -> pending_approval -> approved -> sent -> viewed -> accepted | rejected.
    A WO may return a pending quote to draft with a comment. Only drafts can be edited.
    expired is never stored: a quote is expired once its expiryDate has passed.


    Products: every quote line is a product from the catalog (title and category come from the product; unitPrice
    defaults to the product price and may be changed). Each line keeps the product's unit cost at the time it was
    saved. Cost and profit are visible to every role except customers: they are omitted from customer responses and
    the public share link, not just hidden in the UI.


    Stock: a product with stock null is not tracked (services, licences). For tracked products the quote's total
    quantity per product must not exceed stock when the RM submits or sends it (409), and stock is deducted when the
    customer accepts, in the same transaction (409 if it is no longer available; nothing is deducted then).
    Message: "conflict: not enough stock for <product name> (available <n>)", where n is the stock rounded to
    2 places with trailing zeros and a trailing point removed (25, 2.5, 0).


    Discounts: per line, either a percent of the line amount (discountType percent, discountValue 0..100) or a fixed
    amount in the quote currency for the whole line (discountType amount, discountValue 0..line amount).


    PDF: an approved, sent, viewed, accepted or rejected quote can be downloaded as a PDF (no cost figures).


    Error semantics: 401 no or invalid session; 404 the quote is not visible to the caller (or does not exist);
    403 the caller can see the resource but their role may not perform the action; 409 the action is not
    allowed in the quote's current state.
  contact:
    name: SwiftQuote Team
    url: https://github.com/konrawitAEK/swiftquote
servers:
  - url: http://localhost:8080/api/v1
    description: Local gateway (Go, Spring Boot or Node.js backend)

tags:
  - name: Auth
    description: Authentication and session issuance
  - name: Clients
    description: Tenant-scoped client directory
  - name: Quotes
    description: Role-scoped quotation management and approval workflow
  - name: Dashboard
    description: Sales summary for WOC
  - name: Catalog
    description: Products and product categories used on quote lines
  - name: Admin
    description: Users, team structure, product categories and products (admin, shown as "Back Office")
  - name: ClientPortal
    description: Public, token-based quote access for customers

paths:
  /auth/login:
    post:
      summary: User login (inactive users cannot log in)
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /clients:
    get:
      summary: List clients for current tenant (rm, admin)
      operationId: listClients
      tags: [Clients]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Clients of the current tenant, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories:
    get:
      summary: List product categories, including inactive ones (rm, woc, admin)
      description: RMs may only use active categories on quote lines.
      operationId: listCategories
      tags: [Catalog]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Categories ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products:
    get:
      summary: List products with price, cost and stock, including retired ones (admin, woc, wo, rm)
      description: RMs may only put active products on quote lines. Customers get 403.
      operationId: listProducts
      tags: [Catalog]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Products ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /quotes:
    get:
      summary: List quotations visible to the caller
      description: >-
        rm: quotes they created. wo: quotes created by RMs in teams they lead. woc: all quotes.
        customer: their client's quotes in sent, viewed, accepted or rejected. admin: 403.
        Newest first.
      operationId: listQuotes
      tags: [Quotes]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/QuoteStatus'
      responses:
        '200':
          description: Visible quotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a draft quotation (rm)
      operationId: createQuote
      tags: [Quotes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: Quotation created as draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /quotes/{id}:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    get:
      summary: Get one visible quotation with its history
      description: A customer opening a sent quote marks it viewed. Customers only see customer-facing history events.
      operationId: getQuote
      tags: [Quotes]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Quotation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuoteNotFound'
    put:
      summary: Replace a draft quotation (its creator only)
      operationId: updateQuote
      tags: [Quotes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '200':
          description: Quotation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuoteNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /quotes/{id}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Download the quote as a PDF to send to the customer
      description: >-
        Same visibility as GET /quotes/{id} (admin 403). Only approved, sent, viewed, accepted or rejected quotes;
        otherwise 409 "conflict: cannot export a quote that is <status>". Downloading never changes the status.
      operationId: getQuotePdf
      tags: [Quotes]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: >-
            The quote as a PDF (Content-Type application/pdf, Content-Disposition attachment;
            filename="<quoteNumber>.pdf"). Vendor, client, quote number, dates, lines (title, description, quantity,
            unit price, discount, amount), subtotal, discount, VAT, grand total and, once accepted, the signer and
            date. Never contains cost or profit. Text is rendered with an embedded Thai-capable font.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QuoteNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /quotes/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    post:
      summary: Submit a draft for approval (its creator; requires a team with a WO)
      operationId: submitQuote
      tags: [Quotes]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200': { $ref: '#/components/responses/QuoteDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QuoteNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /quotes/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    post:
      summary: Approve a pending quote (WO leading the creator's team)
      operationId: approveQuote
      tags: [Quotes]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200': { $ref: '#/components/responses/QuoteDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QuoteNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /quotes/{id}/return:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    post:
      summary: Return a pending quote to draft for changes (WO leading the creator's team; comment required)
      operationId: returnQuote
      tags: [Quotes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200': { $ref: '#/components/responses/QuoteDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QuoteNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /quotes/{id}/send:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    post:
      summary: Send an approved, unexpired quote to the customer (its creator)
      operationId: sendQuote
      tags: [Quotes]
      security:
        - BearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/QuoteDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QuoteNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /quotes/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    post:
      summary: Accept and sign a sent quote (customer of its client)
      operationId: acceptQuote
      tags: [Quotes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptQuoteRequest'
      responses:
        '200': { $ref: '#/components/responses/QuoteDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QuoteNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /quotes/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    post:
      summary: Decline a sent quote (customer of its client)
      operationId: rejectQuote
      tags: [Quotes]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200': { $ref: '#/components/responses/QuoteDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QuoteNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /dashboard/summary:
    get:
      summary: Sales summary (woc)
      description: >-
        Covers quotes whose creation date (UTC) is within [from, to], both optional and inclusive.
        Three measures are reported side by side so the client can switch views without refetching:
        won = accepted; pending = sent or viewed and not yet expired (waiting on the customer);
        inApproval = pending_approval or approved (not yet with the customer).
        "Sent" counts quotes in sent, viewed, accepted or rejected. conversionRate = won.count / sentCount
        rounded half-up to 4 decimals (0 when nothing was sent). Amounts are grand totals incl. VAT;
        category amounts are line total plus that line's VAT, so categories add up to grand totals.
        Every Measure also carries cost and profit (before VAT, from the lines that have a cost); a
        category's cost and profit come from its own lines only.
      operationId: getDashboardSummary
      tags: [Dashboard]
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users:
    get:
      summary: List all users of the tenant (admin)
      operationId: listUsers
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Users ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Add a user (admin)
      operationId: createUser
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Replace a user's name, role, team, client and active flag; optionally reset the password (admin)
      description: >-
        Removing someone with history is done by setting active to false, which keeps it;
        accounts without history can be deleted with POST /admin/users/{id}/delete.
        Admins cannot deactivate themselves or change their own role.
      operationId: updateUser
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/delete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Permanently delete a user (admin)
      description: >-
        Only for accounts with no quote history. A user who created a quote or appears in any quote's history returns 409 and should be deactivated instead; a WO who leads a team returns 409 until the team has another WO. Admins cannot delete themselves (400).
        Sent as POST; no body is needed and any body is ignored.
      operationId: deleteUser
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/teams:
    get:
      summary: List teams with their WO and RMs (admin)
      operationId: listTeams
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Teams ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a team led by a WO (admin)
      operationId: createTeam
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Rename a team or change its WO (admin)
      operationId: updateTeam
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/teams/{id}/delete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Delete a team (admin)
      description: >-
        Only an empty team can be deleted; move its members to another team first (409 otherwise).
        Sent as POST; no body is needed and any body is ignored.
      operationId: deleteTeam
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/products:
    post:
      summary: Add a product (admin)
      description: >-
        Validation messages (400 details), first pass: "name is required", "categoryId is required",
        "unitPrice is required", "unitCost is required", "unitPrice must not be negative",
        "unitCost must not be negative", "stock must not be negative"; then "categoryId is not an active category".
        409 product "<name>" already exists (names are unique per tenant).
      operationId: createProduct
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Replace a product's name, category, price, cost, stock and active flag (admin)
      description: >-
        Same messages as create, plus "active is required". Retiring (active false) keeps the product on existing
        quotes but RMs can no longer pick it. Changing the cost does not change existing quote lines.
        404 "not found: product not found".
      operationId: updateProduct
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/products/{id}/delete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Delete a product (admin)
      description: >-
        Only a product that no quote line uses can be deleted; otherwise 409
        "conflict: product is used on quotes; retire it instead". Sent as POST; any body is ignored.
      operationId: deleteProduct
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories:
    post:
      summary: Add a product category (admin)
      operationId: createCategory
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Rename a category or retire it (admin); retired categories stay on existing quotes
      operationId: updateCategory
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories/{id}/delete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Delete a product category (admin)
      description: >-
        Only a category that no quote line and no product uses can be deleted. 409 "conflict: category is used on
        quotes; retire it instead" is checked first, then 409 "conflict: category is used by products; move them to
        another category first". Retire it with active false to hide it instead.
        Sent as POST; no body is needed and any body is ignored.
      operationId: deleteCategory
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /public/quotes/{accessToken}:
    parameters:
      - $ref: '#/components/parameters/AccessToken'
    get:
      summary: Fetch a sent quote by its share link, without login
      description: Only quotes in sent, viewed, accepted or rejected are reachable; opening a sent quote marks it viewed.
      operationId: getPublicQuote
      tags: [ClientPortal]
      responses:
        '200':
          description: Public quote view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuoteView'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/quotes/{accessToken}/pdf:
    parameters:
      - $ref: '#/components/parameters/AccessToken'
    get:
      summary: Download a sent quote as a PDF by its share link, without login
      description: Same reachability as GET /public/quotes/{accessToken} (404 otherwise); does not mark the quote viewed.
      operationId: getPublicQuotePdf
      tags: [ClientPortal]
      responses:
        '200':
          description: >-
            The quote as a PDF (Content-Type application/pdf, Content-Disposition attachment;
            filename="<quoteNumber>.pdf"). Vendor, client, quote number, dates, lines (title, description, quantity,
            unit price, discount, amount), subtotal, discount, VAT, grand total and, once accepted, the signer and
            date. Never contains cost or profit. Text is rendered with an embedded Thai-capable font.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/quotes/{accessToken}/accept:
    parameters:
      - $ref: '#/components/parameters/AccessToken'
    post:
      summary: Accept and sign by share link
      operationId: acceptPublicQuote
      tags: [ClientPortal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptQuoteRequest'
      responses:
        '200': { $ref: '#/components/responses/QuoteDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /public/quotes/{accessToken}/reject:
    parameters:
      - $ref: '#/components/parameters/AccessToken'
    post:
      summary: Decline by share link
      operationId: rejectPublicQuote
      tags: [ClientPortal]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200': { $ref: '#/components/responses/QuoteDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        HS256 signed with the shared JWT_SECRET so tokens work against any backend.
        Claims: sub (user id), tid (tenant/organization id), role, iat, exp (24h).
        The role claim is informational: servers read the current role and active flag from the database.

  parameters:
    QuoteId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccessToken:
      name: accessToken
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    QuoteDetailResponse:
      description: The quotation after the action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteDetail'
    Unauthorized:
      description: Missing, invalid or expired session, or the account is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller's role may not perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found (also returned for malformed ids and tokens)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuoteNotFound:
      description: No quotation with this id visible to the caller (also returned for malformed ids)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate key, or the action is not allowed in the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid payload or math validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    QuoteStatus:
      type: string
      enum: [draft, pending_approval, approved, sent, viewed, accepted, rejected, expired]

    Role:
      type: string
      enum: [admin, woc, wo, rm, customer]

    QuoteEventAction:
      type: string
      enum: [created, updated, submitted, approved, returned, sent, viewed, accepted, rejected]

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, tenantId, user]
      properties:
        accessToken:
          type: string
        tenantId:
          type: string
          format: uuid
        user:
          type: object
          required: [id, name, role]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            role: { $ref: '#/components/schemas/Role' }

    Client:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, nullable: true }

    ProductCategory:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    UpdateCategoryRequest:
      type: object
      required: [name, active]
      properties:
        name: { type: string }
        active: { type: boolean }

    DiscountType:
      type: string
      enum: [percent, amount]

    Product:
      type: object
      required: [id, name, category, unitPrice, unitCost, stock, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/UserRef' }
        unitPrice: { type: number, description: "default selling price per unit" }
        unitCost: { type: number }
        stock: { type: number, nullable: true, description: "null when stock is not tracked" }
        active: { type: boolean }

    CreateProductRequest:
      type: object
      required: [name, categoryId, unitPrice, unitCost]
      properties:
        name: { type: string }
        categoryId: { type: string, format: uuid }
        unitPrice: { type: number, minimum: 0 }
        unitCost: { type: number, minimum: 0 }
        stock: { type: number, minimum: 0, nullable: true, description: "omit or null to not track stock" }

    UpdateProductRequest:
      type: object
      required: [name, categoryId, unitPrice, unitCost, active]
      properties:
        name: { type: string }
        categoryId: { type: string, format: uuid }
        unitPrice: { type: number, minimum: 0 }
        unitCost: { type: number, minimum: 0 }
        stock: { type: number, minimum: 0, nullable: true, description: "omit or null to not track stock" }
        active: { type: boolean }

    QuoteItemInput:
      type: object
      description: >-
        Validation messages (400 details), first pass: "items[i].productId is required",
        "items[i].quantity is required", "items[i].discountType "x" is not a valid DiscountType"; then
        "items[i].productId is not an active product"; then pricing: "items[i]: quantity must be at least 1",
        "items[i]: unitPrice must not be negative", "items[i]: discountValue must not be negative",
        "items[i]: discountValue must be between 0 and 100" (percent),
        "items[i]: discountValue must not exceed the line amount" (amount),
        "items[i]: taxPercent must be between 0 and 100".
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid, description: "an active product; gives the line its title and category" }
        description: { type: string }
        quantity: { type: number, minimum: 1 }
        unitPrice: { type: number, minimum: 0, description: "defaults to the product's unitPrice" }
        discountType: { $ref: '#/components/schemas/DiscountType' }
        discountValue:
          type: number
          minimum: 0
          default: 0
          description: "percent (0..100) or an amount for the whole line (0..quantity*unitPrice), per discountType (default percent)"
        taxPercent: { type: number, default: 7, minimum: 0, maximum: 100 }

    CreateQuoteRequest:
      type: object
      required: [clientId, quoteNumber, expiryDate, items]
      properties:
        clientId: { type: string, format: uuid }
        dealId: { type: string, format: uuid, nullable: true }
        quoteNumber: { type: string }
        expiryDate: { type: string, format: date }
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItemInput'

    CommentRequest:
      type: object
      properties:
        comment: { type: string, nullable: true }

    QuoteSummary:
      type: object
      required: [id, quoteNumber, clientName, status, grandTotal, expiryDate, createdBy]
      properties:
        id: { type: string, format: uuid }
        quoteNumber: { type: string }
        clientName: { type: string }
        status: { $ref: '#/components/schemas/QuoteStatus' }
        grandTotal: { type: number }
        expiryDate: { type: string, format: date }
        createdBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true

    QuoteItemView:
      type: object
      required: [product, title, category, description, quantity, unitPrice, discountType, discountValue, discountAmount, taxPercent, lineTotal]
      properties:
        product:
          description: null for lines created before products existed
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        title: { type: string }
        category:
          description: null for lines created before categories existed
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        description: { type: string, nullable: true }
        quantity: { type: number }
        unitPrice: { type: number }
        discountType: { $ref: '#/components/schemas/DiscountType' }
        discountValue: { type: number, description: "as entered: a percent or an amount" }
        discountAmount: { type: number, description: "the discount in money for this line" }
        taxPercent: { type: number }
        lineTotal: { type: number, description: "after discount, before VAT" }
        unitCost:
          type: number
          nullable: true
          description: "Product cost when the line was saved; null for lines without one. Omitted for customers and the share link."
        costTotal:
          type: number
          nullable: true
          description: "round(quantity * unitCost); null when unitCost is null. Omitted for customers and the share link."
        profit:
          type: number
          nullable: true
          description: "lineTotal - costTotal; null when unitCost is null. Omitted for customers and the share link."

    QuoteEvent:
      type: object
      required: [action, at]
      properties:
        action: { $ref: '#/components/schemas/QuoteEventAction' }
        actor:
          description: null when the customer acted through the share link
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        comment: { type: string, nullable: true }
        at: { type: string, format: date-time }

    QuoteDetail:
      type: object
      required: [id, quoteNumber, status, clientId, clientName, expiryDate, subtotal, discountAmount, taxAmount, grandTotal, items, history]
      properties:
        id: { type: string, format: uuid }
        quoteNumber: { type: string }
        status: { $ref: '#/components/schemas/QuoteStatus' }
        clientId: { type: string, format: uuid }
        clientName: { type: string }
        createdBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        expiryDate: { type: string, format: date }
        subtotal: { type: number }
        discountAmount: { type: number }
        taxAmount: { type: number }
        grandTotal: { type: number }
        costTotal:
          type: number
          nullable: true
          description: "Sum of line costTotal; null if any line has no cost. Omitted for customers."
        profit:
          type: number
          nullable: true
          description: "subtotal - discountAmount - costTotal (before VAT); null if any line has no cost. Omitted for customers."
        accessToken: { type: string, format: uuid }
        signedBy: { type: string, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItemView'
        history:
          description: Oldest first. Customers only receive sent, viewed, accepted and rejected events.
          type: array
          items:
            $ref: '#/components/schemas/QuoteEvent'

    PublicQuoteView:
      type: object
      required: [quoteNumber, status, expiryDate, vendorName, grandTotal, items]
      properties:
        quoteNumber: { type: string }
        status: { $ref: '#/components/schemas/QuoteStatus' }
        expiryDate: { type: string, format: date }
        signedBy: { type: string, nullable: true }
        signedAt: { type: string, format: date-time, nullable: true }
        vendorName: { type: string }
        vendorLogo: { type: string, nullable: true }
        grandTotal: { type: number }
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItemView'

    AcceptQuoteRequest:
      type: object
      required: [signerName, signatureDataUrl]
      properties:
        signerName: { type: string }
        signatureDataUrl: { type: string, description: "Base64 canvas image" }

    Measure:
      type: object
      required: [count, amount, cost, profit]
      properties:
        count: { type: integer }
        amount: { type: number }
        cost:
          type: number
          description: >-
            Sum of line costTotal (round(quantity * unitCost)) over the measured quotes' lines that have a cost.
            Lines without one (created before products existed) are left out of both cost and profit. Before VAT.
        profit:
          type: number
          description: >-
            Sum of line profit (lineTotal - costTotal) over the same lines, before VAT. The margin over those
            lines is profit / (cost + profit).

    DashboardSummary:
      type: object
      required: [from, to, won, pending, inApproval, sentCount, conversionRate, byStatus, byMonth, byRm, byTeam, byCategory]
      properties:
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        won: { $ref: '#/components/schemas/Measure' }
        pending: { $ref: '#/components/schemas/Measure' }
        inApproval: { $ref: '#/components/schemas/Measure' }
        sentCount: { type: integer }
        conversionRate: { type: number, description: "0 to 1, 4 decimals" }
        byStatus:
          description: Every QuoteStatus in enum order, including zero counts
          type: array
          items:
            type: object
            required: [status, count, amount]
            properties:
              status: { $ref: '#/components/schemas/QuoteStatus' }
              count: { type: integer }
              amount: { type: number }
        byMonth:
          description: >-
            UTC months ascending. won is grouped by the month the customer signed, pending by the month the
            quote expires (when it must close). Months with neither are omitted.
          type: array
          items:
            type: object
            required: [month, won, pending]
            properties:
              month: { type: string, example: "2026-10" }
              won: { $ref: '#/components/schemas/Measure' }
              pending: { $ref: '#/components/schemas/Measure' }
        byRm:
          description: Every RM with at least one quote in range, by won amount desc then name
          type: array
          items:
            type: object
            required: [user, team, quoteCount, sentCount, won, pending]
            properties:
              user: { $ref: '#/components/schemas/UserRef' }
              team: { type: string, nullable: true }
              quoteCount: { type: integer }
              sentCount: { type: integer }
              won: { $ref: '#/components/schemas/Measure' }
              pending: { $ref: '#/components/schemas/Measure' }
        byTeam:
          description: Every team, by won amount desc then name; counts quotes of its current RMs
          type: array
          items:
            type: object
            required: [id, name, won, pending]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              won: { $ref: '#/components/schemas/Measure' }
              pending: { $ref: '#/components/schemas/Measure' }
        byCategory:
          description: >-
            Every category with won or pending lines in range, by won amount desc then name; null category
            (lines created before categories existed) last. count is the number of quote lines.
          type: array
          items:
            type: object
            required: [category, won, pending]
            properties:
              category:
                allOf: [{ $ref: '#/components/schemas/UserRef' }]
                nullable: true
              won: { $ref: '#/components/schemas/Measure' }
              pending: { $ref: '#/components/schemas/Measure' }

    AdminUser:
      type: object
      required: [id, email, name, role, active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        team:
          description: The team an RM belongs to
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        client:
          description: The client a customer belongs to
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true

    CreateUserRequest:
      type: object
      required: [email, name, password, role]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password: { type: string, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
        teamId: { type: string, format: uuid, nullable: true, description: "rm only" }
        clientId: { type: string, format: uuid, nullable: true, description: "required for customer, otherwise must be null" }

    UpdateUserRequest:
      type: object
      required: [name, role, active]
      properties:
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        teamId: { type: string, format: uuid, nullable: true, description: "rm only" }
        clientId: { type: string, format: uuid, nullable: true, description: "required for customer, otherwise must be null" }
        password: { type: string, minLength: 8, nullable: true, description: "set to reset the password" }

    Team:
      type: object
      required: [id, name, wo, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        wo:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        members:
          description: Active RMs in the team, by name
          type: array
          items:
            $ref: '#/components/schemas/UserRef'

    TeamRequest:
      type: object
      required: [name, woUserId]
      properties:
        name: { type: string }
        woUserId: { type: string, format: uuid, description: "an active user with role wo" }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
        message: { type: string }
        details: { type: array, items: { type: string }, nullable: true }
